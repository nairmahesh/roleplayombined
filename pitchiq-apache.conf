# Apache VirtualHost for PitchIQ
# Place this file at: /etc/apache2/sites-available/pitchiq.conf
# Then run:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
#   sudo a2ensite pitchiq
#   sudo a2dissite 000-default   # disable default site if not needed
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName YOUR_EC2_IP
    # If you have a domain: ServerName yourdomain.com

    # ── Frontend (React SPA served by Nginx container on 8080) ──────────────
    ProxyPreserveHost On

    # WebSocket for Socket.IO — must come before the general proxy
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket\.io/(.*) ws://127.0.0.1:8081/socket.io/$1 [P,L]

    # API proxy → backend container (port 4000) via frontend Nginx
    ProxyPass /api/ http://127.0.0.1:8081/api/
    ProxyPassReverse /api/ http://127.0.0.1:8081/api/

    # Socket.IO HTTP fallback
    ProxyPass /socket.io/ http://127.0.0.1:8081/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:8081/socket.io/

    # Everything else → frontend SPA
    ProxyPass / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    # Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/pitchiq_error.log
    CustomLog ${APACHE_LOG_DIR}/pitchiq_access.log combined
</VirtualHost>
