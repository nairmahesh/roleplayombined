version: "3.9"

# No db service — using existing native Postgres at 38.242.250.204:5432
# No frontend nginx on port 80 — Apache on the host handles that

services:
  backend:
    build:
      context: ./NeoRoleplaybackend-main
    container_name: pitchiq_backend
    restart: always
    env_file: ./NeoRoleplaybackend-main/.env
    # Expose port 3355 to the host so Apache can proxy to it
    ports:
      - "127.0.0.1:3355:3355"
    extra_hosts:
      # Allows the container to reach the host's native Postgres
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3355/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./NeoRoleplay-main
      target: production
      args:
        # With Apache proxying, /api goes to backend — use relative path
        VITE_API_URL: /api
    container_name: pitchiq_frontend
    restart: always
    # Expose on 8080 so Apache can proxy to it (port 80 is taken by Apache)
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
