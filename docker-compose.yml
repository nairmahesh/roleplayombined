version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: pitchiq_mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: pitchiq

  backend:
    build:
      context: ./backend
    container_name: pitchiq_backend
    restart: always
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/pitchiq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      target: production
      args:
        VITE_API_URL: /api
        VITE_ELEVENLABS_AGENT_ID: ${VITE_ELEVENLABS_AGENT_ID:-}
    container_name: pitchiq_frontend
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  mongo_data:
